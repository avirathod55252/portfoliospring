<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${name} + ' - Portfolio'">Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-900 text-gray-100">
    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <h1 class="text-2xl font-bold text-blue-400" th:text="${name}">Name</h1>
        <div class="flex gap-6">
          <a href="#projects" class="hover:text-blue-400 transition"
            >Projects</a
          >
          <a href="#experience" class="hover:text-blue-400 transition"
            >Experience</a
          >
          <a href="#skills" class="hover:text-blue-400 transition">Skills</a>
          <a href="#contact" class="hover:text-blue-400 transition">Contact</a>
        </div>
      </div>
    </nav>

    <!-- Hero Section -->
    <section
      class="bg-gradient-to-b from-gray-800 to-gray-900 min-h-screen flex items-center justify-center"
    >
      <div class="max-w-4xl mx-auto px-4 text-center">
        <h2
          class="text-6xl font-bold mb-4 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent"
          th:text="${name}"
        >
          Name
        </h2>
        <p class="text-3xl text-blue-400 mb-6" th:text="${title}">Title</p>
        <p
          class="text-lg text-gray-300 mb-8 max-w-2xl mx-auto"
          th:text="${bio}"
        >
          Bio
        </p>

        <!-- Social Links -->
        <div class="flex justify-center gap-6 mb-8" id="contact">
          <a
            th:each="social : ${socialLinks.entrySet()}"
            th:href="${social.value}"
            target="_blank"
            class="px-6 py-3 bg-blue-500 hover:bg-blue-600 rounded-lg font-semibold transition transform hover:scale-105"
            th:text="${social.key}"
            >Link</a
          >
        </div>
      </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="py-16 bg-gray-900">
      <div class="max-w-6xl mx-auto px-4">
        <h3 class="text-4xl font-bold mb-12 text-center text-blue-400">
          Projects
        </h3>
        <div class="grid md:grid-cols-1 lg:grid-cols-2 gap-8">
          <div
            th:each="project : ${projects}"
            class="bg-gray-800 rounded-lg p-6 border border-gray-700 hover:border-blue-400 transition"
          >
            <h4
              class="text-2xl font-bold mb-3 text-white"
              th:text="${project.title}"
            >
              Project Title
            </h4>
            <p class="text-gray-300 mb-4" th:text="${project.description}">
              Description
            </p>
            <p
              class="text-sm text-cyan-400 mb-4"
              th:text="${project.technologies}"
            >
              Technologies
            </p>
            <a
              th:href="${project.link}"
              target="_blank"
              class="inline-block px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded transition"
            >
              View Project
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Experience Section -->
    <section id="experience" class="py-16 bg-gray-800">
      <div class="max-w-6xl mx-auto px-4">
        <h3 class="text-4xl font-bold mb-12 text-center text-blue-400">
          Experience
        </h3>
        <div
          th:each="exp : ${experiences}"
          class="bg-gray-900 rounded-lg p-8 border-l-4 border-blue-500 mb-6"
        >
          <h4 class="text-2xl font-bold text-white" th:text="${exp.title}">
            Title
          </h4>
          <p class="text-cyan-400 font-semibold" th:text="${exp.company}">
            Company
          </p>
          <p class="text-gray-400 mb-3" th:text="${exp.period}">Period</p>
          <p class="text-gray-300" th:text="${exp.description}">Description</p>
        </div>
      </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="py-16 bg-gray-900">
      <div class="max-w-6xl mx-auto px-4">
        <h3 class="text-4xl font-bold mb-12 text-center text-blue-400">
          Skills
        </h3>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          <div
            th:each="skill : ${skills}"
            class="bg-gray-800 rounded-lg p-4 text-center border border-gray-700 hover:border-blue-400 hover:bg-gray-700 transition"
          >
            <span class="text-white font-semibold" th:text="${skill}"
              >Skill</span
            >
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-center py-8 border-t border-gray-700">
      <p class="text-gray-400">© 2026 Avinash Rathod. All rights reserved.</p>
    </footer>
  </body>
</html>
